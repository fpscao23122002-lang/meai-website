# Cấu hình Cloudflare Pages (dùng cho `npm run deploy` / `wrangler pages deploy`)
name = "meai-website"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# ---------------------------------------------------------------------------
# Đăng nhập Google & gói cước (API /api/*, xem docs/TAI-KHOAN.md)
# D1 "meai" lưu tài khoản; bảng dữ liệu tự tạo ở lần gọi API đầu tiên (server/schema.ts).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "meai"
database_id = "774b2e5b-2b00-416b-a259-146cf85df62a"

[vars]
# OAuth Client ID (Web application) — không phải bí mật, trình duyệt nào cũng thấy
GOOGLE_CLIENT_ID = "612950915443-j9u4gqlpopbpfpdkup2uadgqitjpp9hv.apps.googleusercontent.com"
# Thông tin nhận chuyển khoản (VietQR) để trống: sẽ khai báo sau (dự kiến quản lý từ app admin), không gắn cứng.
# BANK_ID = "MB"
# BANK_ACCOUNT = "0123456789"
# BANK_ACCOUNT_NAME = "TEN CHU TAI KHOAN"
# (ADMIN_TOKEN, PAYMENT_WEBHOOK_KEY là bí mật: khai báo dạng Secret trong Cloudflare Dashboard, không ghi ở đây)
