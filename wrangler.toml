# Cấu hình Cloudflare Pages (dùng cho `npm run deploy` / `wrangler pages deploy`)
name = "meai-website"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# ---------------------------------------------------------------------------
# Tài khoản Google & gói cước (API /api/*, xem docs/TAI-KHOAN.md)
# 1) npx wrangler d1 create meai          → copy database_id vào dưới đây
# 2) Bỏ dấu # ở 4 dòng [[d1_databases]] và deploy lại
# 3) npm run db:migrate                     → tạo bảng
# Khi chưa bật, website vẫn chạy bình thường; Khu vực khách hàng hiển thị chế độ xem thử.
# ---------------------------------------------------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "meai"
# database_id = "DÁN_DATABASE_ID_VÀO_ĐÂY"
